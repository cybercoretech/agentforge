name: AgentForge Release

# Publishes attested archives on a vX.Y.Z tag (ADR-0056, Phase 0).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary_extension: ""
          - os: macos-14
            target: x86_64-apple-darwin
            binary_extension: ""
          - os: macos-14
            target: aarch64-apple-darwin
            binary_extension: ""
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary_extension: ".exe"

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Verify tagged workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version="$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "${tag_version}" = "${workspace_version}"

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p agentforge-platform -p agentforge-daemon

      - name: Package release archive
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="snapshot-${GITHUB_SHA:0:12}"
          fi
          archive_root="agentforge-${version}-${{ matrix.target }}"
          mkdir -p "dist/${archive_root}"
          cp "target/${{ matrix.target }}/release/forge${{ matrix.binary_extension }}" "dist/${archive_root}/"
          cp "target/${{ matrix.target }}/release/forged${{ matrix.binary_extension }}" "dist/${archive_root}/"
          tar -czf "dist/${archive_root}.tar.gz" -C dist "${archive_root}"
          python -c 'import hashlib, pathlib; p=pathlib.Path("dist") / "'"${archive_root}"'.tar.gz"; print(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}")' > "dist/${archive_root}.tar.gz.sha256"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    # Runs on tags (publishes) and on manual dispatch (rehearsal). A rehearsal uploads the same
    # files through the same `gh release create` into a draft release, which creates no tag,
    # verifies every asset, and deletes the draft, so the upload is proven without a release
    # (P5-M003). Tag runs verify their published assets the same way. Both attest the archives'
    # build provenance keylessly and verify the uploaded assets' attestations (P5-M004). Both also
    # release a CycloneDX SBOM of forge and forged, attest it for every archive, and verify those
    # attestations on the uploaded assets (P5-M006).
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # Checked out first: checkout cleans the workspace. It provides scripts/publish-release,
      # scripts/sbom-merge, and the Cargo metadata the SBOM is generated from.
      - name: Check out publish script
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The SBOM (P5-M006, ADR-0054) describes forge and forged from this commit's own Cargo.lock:
      # cargo-cyclonedx reads the repository's cargo metadata and builds nothing. It is made
      # before the release files are selected so that SHA256SUMS covers it.
      - name: Install stable Rust and cargo-cyclonedx
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo install --locked cargo-cyclonedx@0.5.9

      - name: Generate the release SBOM
        id: sbom
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="snapshot-${GITHUB_SHA:0:12}"
          fi
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          cargo cyclonedx --format json --spec-version 1.5 --describe binaries --no-build-deps --target all
          mkdir sbom
          python3 scripts/sbom-merge --name agentforge --version "${version}" \
            crates/agentforge-cli/forge_bin.cdx.json crates/agentforge-daemon/forged_bin.cdx.json \
            > "sbom/agentforge-${version}.cdx.json"
          echo "path=release/agentforge-${version}.cdx.json" >> "$GITHUB_OUTPUT"

      - name: Select release files and create consolidated checksums
        # Artifacts also contain each target's staging directory; only regular files are
        # released. Exactly four archives, each with its .sha256, and exactly one SBOM are
        # required.
        run: |
          set -euo pipefail
          mkdir release
          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.tar.gz.sha256' \) -exec cp {} release/ \;
          find sbom -maxdepth 1 -type f -name '*.cdx.json' -exec cp {} release/ \;
          cd release
          archives=$(find . -maxdepth 1 -name '*.tar.gz' -type f | wc -l)
          if [ "$archives" -ne 4 ]; then
            echo "expected 4 archives, found $archives" >&2
            exit 1
          fi
          sboms=$(find . -maxdepth 1 -name '*.cdx.json' -type f | wc -l)
          if [ "$sboms" -ne 1 ]; then
            echo "expected 1 SBOM (*.cdx.json), found $sboms" >&2
            exit 1
          fi
          test -f "../${{ steps.sbom.outputs.path }}" \
            || { echo "missing ${{ steps.sbom.outputs.path }}" >&2; exit 1; }
          for archive in *.tar.gz; do
            test -f "$archive.sha256" || { echo "missing $archive.sha256" >&2; exit 1; }
            sha256sum -c "$archive.sha256"
          done
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.cdx.json' \) -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "release files:"
          ls -l

      # Keyless SLSA build provenance (Sigstore, from this workflow's OIDC identity): no key to
      # hold. Verify with `gh attestation verify <archive> -R cybercoretech/agentforge`.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: release/*.tar.gz

      # The same keyless signing, binding the SBOM to every archive (ADR-0054). Verify with
      # `gh attestation verify <archive> -R cybercoretech/agentforge --predicate-type
      # https://cyclonedx.org/bom`.
      - name: Attest the SBOM
        uses: actions/attest@v4
        with:
          subject-path: release/*.tar.gz
          sbom-path: ${{ steps.sbom.outputs.path }}

      - name: Publish release and verify the uploaded assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
        run: ./scripts/publish-release tag "${GITHUB_REF_NAME}" release

      - name: Rehearse the upload to a draft release, verify, and delete it
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTATION_SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.yml
        run: ./scripts/publish-release rehearse "rehearsal-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${GITHUB_SHA}" release

name: AgentForge CI

# Gate for pushes to main and pull requests (ADR-0056, Phase 0).

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  repository-policy:
    name: Repository policy
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Validate text policy
        run: ./scripts/check-text-files

      - name: Validate repository structure
        run: cargo run -p xtask --locked -- validate

      - name: Validate plan-first policy
        run: cargo run -p xtask --locked -- validate-plan-policy

      - name: Validate site updates feed sources
        run: ./scripts/site-updates --output "$RUNNER_TEMP/updates.json"

      - name: Self-test real-agent bridge
        run: ./scripts/agents/claude-code-bridge --self-test

      - name: Self-test shared bridge kit
        run: python3 scripts/agents/bridge_kit.py --self-test

      - name: Self-test Codex bridge
        run: ./scripts/agents/codex-bridge --self-test

      - name: Self-test OpenCode bridge
        run: ./scripts/agents/opencode-bridge --self-test

      - name: Conformance-test real-agent bridges
        run: python3 scripts/agents/bridge_conformance.py

      - name: End-to-end test Codex bridge
        run: python3 scripts/agents/codex_e2e.py

      - name: End-to-end test OpenCode bridge
        run: python3 scripts/agents/opencode_e2e.py

      - name: Self-test milestone tagger
        run: ./scripts/tag-milestone --self-test

      - name: Self-test release publisher
        run: ./scripts/publish-release --self-test

      - name: Self-test release SBOM merge
        run: python3 scripts/sbom-merge --self-test

  stable-code:
    name: Stable code gate
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust with lint components
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

  msrv:
    name: MSRV 1.85.0
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install MSRV
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Check workspace on MSRV
        run: cargo +1.85.0 check --workspace --all-targets --locked

      - name: Test workspace on MSRV
        run: cargo +1.85.0 test --workspace --locked

  cli-smoke:
    name: CLI smoke
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: forge version
        run: cargo run -p agentforge-platform --bin forge --locked -- version

      - name: forge doctor
        run: cargo run -p agentforge-platform --bin forge --locked -- doctor

      - name: forged version
        run: cargo run -p agentforge-daemon --locked -- --version

  platform-matrix:
    name: Platform ${{ matrix.os }}
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
    steps:
      - name: Check out exact head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check workspace on ${{ matrix.os }}
        run: cargo check --workspace --all-targets --locked

      - name: Run portable tests on ${{ matrix.os }}
        run: >-
          cargo test --workspace --locked
          --exclude agentforge-adapter
          --exclude agentforge-ci
          --exclude agentforge-gate
          --exclude agentforge-orchestrator

      - name: forge smoke on ${{ matrix.os }}
        run: cargo run -p agentforge-platform --bin forge --locked -- version

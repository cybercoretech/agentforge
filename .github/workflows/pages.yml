name: AgentForge Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history lets the updates feed date milestones from their closure commits.
          fetch-depth: 0

      - name: Generate updates feed
        run: ./scripts/site-updates --output site/updates.json

      - name: Validate static site boundary
        run: |
          test -s site/updates.json
          grep -Fq 'id="updates"' site/index.html
          grep -Fq 'updates.json' site/script.js
          test -s site/index.html
          test -s site/styles.css
          test -s site/script.js
          grep -Fq 'id="main-content"' site/index.html
          grep -Fq 'id="readme-dialog"' site/index.html
          grep -Fq 'id="readme-trigger"' site/index.html
          grep -Fq 'showModal' site/script.js
          grep -Fq 'README.md' site/index.html
          grep -Fq 'AgentForge' site/index.html
          grep -Fq 'pre-release' site/index.html
          grep -Fq 'prefers-reduced-motion' site/styles.css

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: ./.github/actions/upload-pages-artifact
        with:
          path: site

  deploy:
    name: Deploy Pages
    needs: build
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

[workspace]
members = [
    "crates/agentforge-core",
    "crates/agentforge-state",
    "crates/agentforge-worktree",
    "crates/agentforge-adapter",
    "crates/agentforge-gate",
    "crates/agentforge-ci",
    "crates/agentforge-audit",
    "crates/agentforge-policy",
    "crates/agentforge-mcp",
    "crates/agentforge-intake",
    "crates/agentforge-hud",
    "crates/agentforge-operator",
    "crates/agentforge-orchestrator",
    "crates/agentforge-scheduler",
    "crates/agentforge-cli",
    "crates/agentforge-daemon",
    "tools/xtask",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.85"
authors = ["AgentForge contributors"]
description = "Local-first, model-agnostic agentic software-development environment"
repository = "https://github.com/cybercoretech/agentforge"
homepage = "https://cybercoretech.github.io/agentforge/"
readme = "README.md"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
